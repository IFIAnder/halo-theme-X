<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <title th:text="${'页面未找到 / ' + site.title}"></title>
  </th:block>
    <th:block th:fragment="content">
      <div class="x-error">
        <div class="x-error__code" th:text="${error != null and error.status != null ? error.status : 404}">404</div>
        <h1 class="x-error__title">这里什么都没有</h1>
        <p class="x-error__desc">
          你要找的页面不存在，或者已经被删除了。要不回主页看看？
        </p>
        <a class="x-btn x-btn--primary" th:href="@{/}">回到主页</a>
      </div>
    </th:block>
</html>
