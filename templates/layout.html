<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:fragment="html (head, content)"
  th:lang="${site.language ?: 'zh-CN'}"
  th:attr="data-default-theme=${theme.config.appearance?.color_scheme ?: 'dark'},data-timeline-mode=${theme.config.content?.timeline_mode ?: theme.config.appearance?.timeline_mode ?: 'comfortable'},data-round-media=${theme.config.appearance?.round_media == null or theme.config.appearance.round_media ? 'true' : 'false'},data-allow-switch=${theme.config.appearance?.allow_visitor_switch == true ? 'true' : 'false'}"
  th:style="|--x-accent:${theme.config.appearance?.accent_color ?: '#1D9BF0'};--x-fs:${theme.config.appearance?.font_size ?: '15'}px;--x-bg-dark-set:${theme.config.appearance?.bg_dark ?: '#000000'};--x-bg-dim-set:${theme.config.appearance?.bg_dim ?: '#15202B'};--x-bg-light-set:${theme.config.appearance?.bg_light ?: '#FFFFFF'};|"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- 页面布局契约：调用方未提供 head 时输出站点标题，避免出现两个 <title> -->
    <title th:if="${head == null}" th:text="${site.title}"></title>
    <th:block th:if="${head != null}">
      <th:block th:replace="${head}"></th:block>
    </th:block>

    <link
      rel="icon"
      th:if="${not #strings.isEmpty(site.favicon)}"
      th:href="@{${site.favicon}}"
    />
    <link rel="stylesheet" th:href="@{/assets/css/x.css(v=${theme.spec.version})}" />
    <script>
      /* 配色初始化：必须在样式表应用前跑完，避免闪白。
         - data-theme 始终写「解析后的具体值」（dark / dim / light），CSS 只认这个
         - data-preference 记录当前生效的偏好（可能是 system）

         站长在主题设置里选的方案是唯一权威来源。只有站长显式打开
         「允许访客自行切换配色」时，才认访客的本地偏好；而且这份本地偏好必须带上
         「当前站点设置的指纹」，一旦站长改了设置就立刻作废 —— 否则访客会陷在某个
         旧选择里，后台怎么改都不生效。

         另外：早期版本把 light 标成「默认」，谁点一下就会把「覆盖成亮色」永久写进
         localStorage，这就是「无论怎么设置都强制亮色」的来源。关闭开关时这里会
         主动把历史脏数据清掉。 */
      (function () {
        var root = document.documentElement;

        function resolve(scheme) {
          if (scheme === 'system') {
            try {
              return window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
            } catch (e) {
              return 'dark';
            }
          }
          return scheme === 'dim' || scheme === 'light' ? scheme : 'dark';
        }

        function clearOverride() {
          try {
            window.localStorage.removeItem('x-color-scheme');
            window.localStorage.removeItem('x-color-scheme-stamp');
            window.localStorage.removeItem('x-color-scheme-preset');
          } catch (e) {}
        }

        var preset = root.getAttribute('data-default-theme') || 'dark';
        var allowSwitch = root.getAttribute('data-allow-switch') === 'true';
        var scheme = preset;

        if (allowSwitch) {
          try {
            var saved = window.localStorage.getItem('x-color-scheme');
            var stamp = window.localStorage.getItem('x-color-scheme-stamp');
            if (saved && stamp === preset) scheme = saved;
            else if (saved) clearOverride();
          } catch (e) {}
        } else {
          clearOverride();
        }

        root.setAttribute('data-theme', resolve(scheme));
        root.setAttribute('data-preference', scheme);

        /* 系统配色变化时实时同步（仅当生效偏好是「跟随系统」） */
        try {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            if (root.getAttribute('data-preference') === 'system') {
              root.setAttribute('data-theme', resolve('system'));
            }
          });
        } catch (e) {}
      })();
    </script>
    <!-- 开屏「仅首次访问」模式：本次会话已经看过就尽早打标记（HTML 里 splash 出现前），
         CSS 直接不渲染，不会闪一下。存储不可用时退化为每次都显示，不影响进入页面。 -->
    <script
      th:if="${(theme.config.layout?.enable_loading_screen == null or theme.config.layout.enable_loading_screen)
               and (theme.config.layout?.loading_screen_mode ?: 'session') == 'session'}"
    >
      (function () {
        try {
          if (window.sessionStorage.getItem('x-splash-seen')) {
            document.documentElement.setAttribute('data-splash-skip', '');
          } else {
            window.sessionStorage.setItem('x-splash-seen', '1');
          }
        } catch (e) {}
      })();
    </script>
    <script defer th:src="@{/assets/js/main.js(v=${theme.spec.version})}"></script>
  </head>

      </symbol>
      <symbol id="i-link-f" viewBox="0 0 24 24">
        <path fill="currentColor" d="M15.5 2.9a4.9 4.9 0 0 1 3.5 8.4l-1.9 1.9a1 1 0 0 1-1.4-1.4l1.9-1.9a2.9 2.9 0 1 0-4.1-4.1l-1.3 1.3A1 1 0 0 1 10.8 5.7l1.3-1.3a4.9 4.9 0 0 1 3.4-1.5Zm-7 8.4a1 1 0 0 1 0 1.4l-1.9 1.9a2.9 2.9 0 1 0 4.1 4.1l1.3-1.3a1 1 0 1 1 1.4 1.4l-1.3 1.3A4.9 4.9 0 0 1 5.2 12l1.9-1.9a1 1 0 0 1 1.4 0Z" />
      </symbol>

      <!-- 通知（铃铛） -->
      <symbol id="i-bell" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M12 3.3A6.1 6.1 0 0 0 5.9 9.4v3L4.4 15.3a.9.9 0 0 0 .8 1.3h13.6a.9.9 0 0 0 .8-1.3l-1.5-2.9v-3A6.1 6.1 0 0 0 12 3.3Z" />
        <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M9.8 19.2a2.4 2.4 0 0 0 4.4 0" />
      </symbol>
      <symbol id="i-bell-f" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 2.7a6.6 6.6 0 0 0-6.6 6.6v2.9l-1.6 3.1A1.1 1.1 0 0 0 4.8 17h14.4a1.1 1.1 0 0 0 1-1.7l-1.6-3.1V9.3A6.6 6.6 0 0 0 12 2.7Z" />
        <path fill="currentColor" d="M9.4 18.8a2.7 2.7 0 0 0 5.2 0Z" />
      </symbol>

      <!-- 位置（地图针） -->
      <symbol id="i-location" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M12 21.2s6.5-6 6.5-11a6.5 6.5 0 1 0-13 0c0 5 6.5 11 6.5 11Z" />
        <circle cx="12" cy="10.1" r="2.4" fill="none" stroke="currentColor" stroke-width="1.9" />
      </symbol>

    </svg>

    <!-- ============ 加载页（开屏） ============ -->
    <!-- 仿 X App 的启动画面：页面就绪后由 main.js 淡出；脚本不可用时由 CSS 动画兜底自动消失，不会卡住页面。
         标识跟随「账号信息与标识」设置，不写死（X Logo / 自定义图片 / 文字，与左栏同款回退逻辑）。 -->
    <th:block th:if="${theme.config.layout?.enable_loading_screen == null or theme.config.layout.enable_loading_screen}">
      <div
        class="x-splash"
        data-x-splash
        aria-hidden="true"
        th:with="
          logoType=${theme.config.brand?.logo_type ?: 'x'},
          logoImage=${theme.config.brand?.logo_image},
          logoText=${#strings.isEmpty(theme.config.brand?.logo_text) ? site.title : theme.config.brand.logo_text},
          logoSubtitle=${theme.config.brand?.logo_subtitle}
        "
      >
        <!-- 文字形态 -->
        <span class="x-splash__text" th:if="${logoType == 'text'}">
          <span class="x-splash__main" th:text="${logoText}"></span>
          <span class="x-splash__sub" th:if="${not #strings.isEmpty(logoSubtitle)}" th:text="${logoSubtitle}"></span>
        </span>
        <!-- 图片 / X Logo 形态（图片缺失时回退 X Logo，与左栏一致） -->
        <th:block th:unless="${logoType == 'text'}">
          <img
            class="x-splash__img"
            th:if="${logoType == 'image' and not #strings.isEmpty(logoImage)}"
            th:src="@{${logoImage}}"
            th:alt="${logoText}"
          />
          <svg
            class="x-splash__icon"
            th:if="${logoType == 'x' or (logoType == 'image' and #strings.isEmpty(logoImage))}"
            viewBox="0 0 24 24"
          ><use href="#i-x"></use></svg>
        </th:block>
      </div>
    </th:block>

    <!-- ============ 应用骨架 ============ -->
    <div class="x-app">
      <th:block th:if="${theme.config.layout?.show_left_nav == null or theme.config.layout.show_left_nav}">
        <div th:replace="~{modules/left-nav :: nav}"></div>
      </th:block>

      <main class="x-main">
        <th:block th:replace="${content}"></th:block>
      </main>

      <th:block th:if="${theme.config.layout?.show_right_rail == null or theme.config.layout.show_right_rail}">
        <div th:replace="~{modules/right-rail :: rail}"></div>
      </th:block>
    </div>

    <!-- 移动端底部导航 -->
    <th:block th:if="${theme.config.layout?.show_mobile_nav == null or theme.config.layout.show_mobile_nav}">
      <div th:replace="~{modules/mobile-nav :: nav}"></div>

    </th:block>

    <!-- 瞬间投稿悬浮按钮（移动端右下角）
         开启「站内直接发瞬间」时打开主题内的 X 风格弹层，否则退回跳转旧发布地址 -->
    <th:block th:if="${theme.config.moments?.enable_moment_publish ?: theme.config.features?.enable_moment_publish ?: true}">
      <th:block
        th:with="publishUri=${theme.config.routes?.moment_publish_uri ?: '/uc/moments'},
                 loginUri=${theme.config.routes?.login_uri ?: '/login'},
                 inlineCompose=${theme.config.moments?.enable_inline_compose ?: theme.config.features?.enable_inline_compose ?: true}"
      >
        <th:block sec:authorize="isAuthenticated()">
          <button
            class="x-fab"
            type="button"
            th:if="${inlineCompose}"
            data-x-modal-open="compose"
            aria-label="发布瞬间"
          >
            <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-compose"></use></svg>
          </button>
          <a
            class="x-fab"
            th:unless="${inlineCompose}"
            th:href="@{${publishUri}}"
            aria-label="发布瞬间"
          >
            <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-compose"></use></svg>
          </a>
        </th:block>
        <a class="x-fab" sec:authorize="isAnonymous()" th:href="@{${loginUri}(redirect_uri=${publishUri})}" aria-label="登录后发布瞬间">
          <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-compose"></use></svg>
        </a>
      </th:block>
    </th:block>

    <!-- 站内发瞬间弹层（仅登录用户渲染） -->
    <th:block th:if="${theme.config.moments?.enable_moment_publish ?: theme.config.features?.enable_moment_publish ?: true}">
      <th:block sec:authorize="isAuthenticated()">
        <th:block
          th:with="me=${contributorFinder.getContributor(#authentication.name)},
                   meName=${me != null and not #strings.isEmpty(me.displayName) ? me.displayName : #authentication.name},
                   meAvatar=${me != null ? me.avatar : ''},
                   meInitial=${#strings.isEmpty(meName) ? 'U' : #strings.substring(meName, 0, 1)}"
        >
          <div th:replace="~{modules/compose :: modal(${meAvatar}, ${meInitial}, ${meName})}"></div>
        </th:block>
      </th:block>
    </th:block>

    <footer class="x-site-footer">
      <halo:footer />
    </footer>
  </body>
</html>
