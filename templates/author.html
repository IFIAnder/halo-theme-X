<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <title th:text="${(author != null ? author.spec.displayName : '作者') + ' / ' + site.title}"></title>
  </th:block>
  <th:block
    th:fragment="content"
    th:with="
      authorName=${author != null ? author.spec.displayName : '作者'},
      authorHandle=${author != null and author.metadata != null ? author.metadata.name : 'unknown'},
      authorAvatar=${author != null ? author.spec.avatar : ''},
      authorBio=${author != null ? author.spec.bio : ''},
      showJoinDate=${theme.config.features?.show_join_date == null or theme.config.features.show_join_date},
      authorJoinDate=${author != null and author.spec != null and not #strings.isEmpty(author.spec.registeredAt) ? author.spec.registeredAt : (author != null and author.metadata != null ? (author.metadata.creationTimestamp ?: '') : '')},
      initial=${#strings.isEmpty(authorName) ? 'A' : #strings.substring(authorName, 0, 1)},
      postTotal=${posts != null ? posts.total : 0},
      authorPosts=${posts != null ? posts.items : null},
      annotationCover=${author != null and author.metadata != null and author.metadata.annotations != null and author.metadata.annotations['theme-x/cover'] != null ? author.metadata.annotations['theme-x/cover'] : ''},
      defaultCover=${theme.config.brand?.author_cover ?: (theme.config.brand?.banner ?: '')},
      authorCover=${not #strings.isEmpty(annotationCover) ? annotationCover : defaultCover},
      authorLocation=${author != null and author.metadata != null and author.metadata.annotations != null and author.metadata.annotations['theme-x/location'] != null ? author.metadata.annotations['theme-x/location'] : ''},
      authorWebsite=${author != null and author.metadata != null and author.metadata.annotations != null and author.metadata.annotations['website'] != null ? author.metadata.annotations['website'] : ''},
      authorWebsiteLabel=${#strings.replace(#strings.replace(authorWebsite, 'https://', ''), 'http://', '')},
      canEdit=${theme.config.features?.enable_profile_edit == null or theme.config.features.enable_profile_edit},
      isSelf=${#authentication != null and #authentication.isAuthenticated() and #authentication.name == authorHandle}
    "
  >
    <header class="x-topbar x-topbar--detail">
      <div class="x-topbar__row">
        <a class="x-iconbtn" href="/" data-x-action="back" aria-label="返回">
          <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-back"></use></svg>
        </a>
        <div class="x-topbar__headline">
          <h1 class="x-topbar__title" th:text="${authorName}"></h1>
          <span class="x-topbar__sub" th:text="${postTotal + ' 篇帖子'}"></span>
        </div>
        <div th:replace="~{modules/account :: actions}"></div>
      </div>
    </header>

    <section class="x-profile">
      <div class="x-profile__banner">
        <img th:if="${not #strings.isEmpty(authorCover)}" th:src="@{${authorCover}}" alt="" />
        <div class="x-profile__banner-fallback" th:unless="${not #strings.isEmpty(authorCover)}"></div>
      </div>
      <div class="x-profile__bar">
        <img
          class="x-avatar x-avatar--96 x-profile__avatar"
          th:if="${not #strings.isEmpty(authorAvatar)}"
          th:src="@{${authorAvatar}}"
          th:alt="${authorName}"
        />
        <span class="x-avatar x-avatar--96 x-avatar--fallback x-profile__avatar" th:unless="${not #strings.isEmpty(authorAvatar)}" th:text="${initial}"></span>
        <!-- 作者本人：直接在主页改资料，不必再跑去个人中心 -->
        <button
          class="x-btn x-btn--outline x-profile__edit"
          type="button"
          th:if="${isSelf and canEdit}"
          data-x-modal-open="profile"
        >编辑个人资料</button>
      </div>
      <div class="x-profile__info">
        <h2 class="x-profile__name">
          <span th:text="${authorName}"></span>
          <th:block th:replace="~{modules/verified :: badge(${authorHandle})}"></th:block>
        </h2>
        <span class="x-profile__handle" th:text="${'@' + authorHandle}"></span>
        <p
          class="x-profile__bio"
          th:if="${authorBio != null and not #strings.isEmpty(authorBio)}"
          th:text="${authorBio}"
        ></p>
        <div class="x-profile__meta">
          <!-- 位置：来自 theme-x/location 注解，halo-plugin-X 或后台手动写入 -->
          <span class="x-profile__meta-item" th:if="${not #strings.isEmpty(authorLocation)}">
            <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-location"></use></svg>
            <span th:text="${authorLocation}"></span>
          </span>

          <!-- 加入日期 -->
          <span class="x-profile__meta-item" th:if="${showJoinDate and not #strings.isEmpty(authorJoinDate)}">
            <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-calendar"></use></svg>
            <span>
              加入于
              <span
                data-x-date="yyyy-MM-dd"
                th:attr="data-datetime=${authorJoinDate}"
                th:text="${authorJoinDate}"
              >—</span>
            </span>
          </span>

          <!-- 网站：取自 User 的 website 注解，社区插件（如 halo-plugin-X）或后台编辑用户时写入 -->
          <a
            class="x-profile__meta-item x-profile__meta-link"
            th:if="${not #strings.isEmpty(authorWebsite)}"
            th:href="${authorWebsite}"
            target="_blank"
            rel="noopener nofollow"
            th:title="${authorWebsite}"
          >
            <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-link"></use></svg>
            <span th:text="${authorWebsiteLabel}"></span>
          </a>

          <!-- 帖子数：顶栏已经有一处，这里用图标化的形式再给一次锚点 -->
          <span class="x-profile__meta-item">
            <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-compose"></use></svg>
            <span th:text="${postTotal + ' 篇帖子'}"></span>
          </span>
        </div>

        <!-- TA 常聊的话题：从当前页文章里聚合，前端去重后取前 6 个 -->
        <div
          class="x-profile__topics"
          th:if="${authorPosts != null and !#lists.isEmpty(authorPosts)}"
          data-x-author-topics
          hidden
        >
          <th:block th:each="ap : ${authorPosts}">
            <th:block th:each="at : ${ap.tags}">
              <a
                class="x-profile__topic"
                data-x-topic
                th:href="@{${at.status.permalink}}"
                th:text="${'#' + at.spec.displayName}"
              ></a>
            </th:block>
          </th:block>
        </div>
      </div>
    </section>

    <nav class="x-tabs">
      <span class="x-tab is-active">帖子</span>
    </nav>

    <th:block th:if="${authorPosts != null}">
      <div class="x-timeline" data-x-timeline>
        <th:block th:each="post : ${authorPosts}">
          <div th:replace="~{modules/post-card :: card(${post})}"></div>
        </th:block>
      </div>
    </th:block>

    <div class="x-empty" th:if="${authorPosts == null or #lists.isEmpty(authorPosts)}">
      <h2>这位作者还没有发布内容</h2>
    </div>

    <div class="x-loadmore" th:if="${posts != null and (posts.hasPrevious() or posts.hasNext())}">
      <a class="x-btn x-btn--outline" th:if="${posts.hasPrevious()}" th:href="@{${posts.prevUrl}}">上一页</a>
      <span class="x-loadmore__page" th:text="${posts.page + ' / ' + posts.totalPages}"></span>
      <a class="x-btn x-btn--outline" th:if="${posts.hasNext()}" th:href="@{${posts.nextUrl}}">下一页</a>
    </div>

    <!-- 编辑个人资料弹层（仅作者本人） -->
    <th:block th:if="${isSelf and canEdit}">
      <div th:replace="~{modules/profile-edit :: modal(${authorName}, ${authorBio}, ${authorAvatar}, ${initial}, ${authorHandle})}"></div>
    </th:block>
  </th:block>
</html>
