<!--
  瞬间卡片（对应 X 的推文）
  依赖：halo-plugin-moments（瞬间插件）
  数据结构：MomentVo —— owner 是扁平 ContributorVo，正文在 spec.content.html，媒体在 spec.content.medium
-->
<article
  class="x-post x-post--moment"
  th:fragment="card(moment)"
  th:with="
    owner=${moment.owner},
    authorName=${owner != null ? owner.displayName : '匿名作者'},
    authorHandle=${owner != null and not #strings.isEmpty(owner.name) ? owner.name : 'unknown'},
    authorAvatar=${owner != null ? owner.avatar : ''},
    initial=${#strings.isEmpty(authorName) ? 'A' : #strings.substring(authorName, 0, 1)},
    media=${moment.spec.content.medium},
    tags=${moment.spec.tags},
    momentsUri=${theme.config.routes?.moments_uri ?: '/moments'},
    authorsUri=${theme.config.routes?.authors_uri ?: '/authors'},
    detailUrl=${momentsUri + '/' + moment.metadata.name},
    showStats=${theme.config.content?.show_stats ?: theme.config.features?.show_stats ?: true}
  "
  th:attr="data-href=${detailUrl},data-moment-name=${moment.metadata.name}"
  role="article"
>
  <a class="x-post__avatar" th:href="@{${authorsUri + '/' + authorHandle}}">
    <img
      class="x-avatar x-avatar--40"
      th:if="${not #strings.isEmpty(authorAvatar)}"
      th:src="@{${authorAvatar}}"
      th:alt="${authorName}"
      loading="lazy"
    />
    <span class="x-avatar x-avatar--40 x-avatar--fallback" th:unless="${not #strings.isEmpty(authorAvatar)}" th:text="${initial}"></span>
  </a>

  <div class="x-post__body">
    <header class="x-post__head">
      <a class="x-post__name" th:href="@{${authorsUri + '/' + authorHandle}}">
        <span th:text="${authorName}"></span>
        <th:block th:replace="~{modules/verified :: badge(${authorHandle})}"></th:block>
      </a>
      <span class="x-post__handle" th:text="${'@' + authorHandle}"></span>
      <span class="x-post__dot" aria-hidden="true">·</span>
      <a class="x-post__time" th:href="@{${detailUrl}}">
        <time th:attr="datetime=${moment.spec.releaseTime}" th:text="${moment.spec.releaseTime}"></time>
      </a>
      <button
        class="x-post__more"
        type="button"
        th:attr="data-href=${detailUrl},aria-label='更多'"
        data-x-action="copy"
      >
        <svg class="x-icon x-icon--o" viewBox="0 0 24 24"><use href="#i-more"></use></svg><svg class="x-icon x-icon--f" viewBox="0 0 24 24"><use href="#i-more-f"></use></svg>
      </button>
    </header>

    <div class="x-post__content">
      <div
        class="x-post__text x-prose"
        th:if="${moment.spec.content != null and not #strings.isEmpty(moment.spec.content.html)}"
        th:utext="${moment.spec.content.html}"
      ></div>

      <div
        class="x-media"
        th:if="${media != null and !#lists.isEmpty(media)}"
        th:classappend="${#lists.size(media) > 1 ? 'x-media--grid' : ''}"
      >
        <th:block th:each="item : ${media}">
          <img
            class="x-media__item"
            th:if="${item.type.name == 'PHOTO'}"
            th:src="${item.url}"
            th:alt="${authorName}"
            loading="lazy"
          />
          <video
            class="x-media__item"
            th:if="${item.type.name == 'VIDEO'}"
            th:src="${item.url}"
            controls
            preload="metadata"
          ></video>
          <audio
            class="x-media__audio"
            th:if="${item.type.name == 'AUDIO'}"
            th:src="${item.url}"
            controls
          ></audio>
          <a
            class="x-media__link"
            th:if="${item.type.name == 'POST'}"
            th:href="@{${item.url}}"
          >
            <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-image"></use></svg>
            <span>阅读关联文章</span>
          </a>
        </th:block>
      </div>

      <div class="x-post__topics" th:if="${tags != null and !#lists.isEmpty(tags)}">
        <a
          class="x-post__topic"
          th:each="tag : ${tags}"
          th:href="@{${momentsUri}(tag=${tag})}"
          th:text="${'#' + tag}"
        ></a>
      </div>
    </div>

    <footer class="x-post__actions">
      <a class="x-action x-action--reply" th:attr="href=${detailUrl + '#comments'},aria-label='回复'">
        <span class="x-action__icon">
          <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-reply"></use></svg>
        </span>
        <span
          class="x-action__count"
          th:if="${showStats and moment.stats != null and moment.stats.totalComment > 0}"
          th:text="${moment.stats.totalComment}"
        ></span>
      </a>

      <button
        class="x-action x-action--repost"
        type="button"
        th:attr="data-href=${detailUrl},aria-label='复制链接'"
        data-x-action="copy"
      >
        <span class="x-action__icon">
          <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-repost"></use></svg>
        </span>
      </button>

      <button
        class="x-action x-action--like"
        type="button"
        th:attr="data-moment-name=${moment.metadata.name},aria-label='点赞'"
        data-x-action="moment-like"
      >
        <span class="x-action__icon">
          <svg class="x-icon x-icon--o" viewBox="0 0 24 24"><use href="#i-heart"></use></svg><svg class="x-icon x-icon--f" viewBox="0 0 24 24"><use href="#i-heart-f"></use></svg>
        </span>
        <span
          class="x-action__count"
          th:if="${showStats and moment.stats != null and moment.stats.upvote > 0}"
          th:text="${moment.stats.upvote}"
        ></span>
      </button>

      <a class="x-action x-action--views" th:attr="href=${detailUrl},aria-label='查看详情'">
        <span class="x-action__icon">
          <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-views"></use></svg>
        </span>
        <span
          class="x-action__count"
          th:if="${moment.stats != null and moment.stats.totalComment > 0}"
          th:text="${moment.stats.totalComment}"
        ></span>
      </a>

      <span class="x-action__spacer"></span>

      <button class="x-action x-action--bookmark" type="button" data-x-action="bookmark" aria-label="收藏">
        <span class="x-action__icon">
          <svg class="x-icon x-icon--o" viewBox="0 0 24 24"><use href="#i-bookmark"></use></svg><svg class="x-icon x-icon--f" viewBox="0 0 24 24"><use href="#i-bookmark-f"></use></svg>
        </span>
      </button>

      <button
        class="x-action x-action--share"
        type="button"
        th:attr="data-href=${detailUrl},aria-label='分享'"
        data-x-action="share"
      >
        <span class="x-action__icon">
          <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-share"></use></svg>
        </span>
      </button>
    </footer>
  </div>
</article>
