apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-x
spec:
  displayName: "X"
  author:
    name: Ander.
    website: "https://github.com/IFIAnder"
  description: "高仿 X（Twitter）的 Halo 2.x 主题。三栏时间线布局、Lights out / Dim / Light 三档配色、推文形态的文章卡片、认证蓝标、作者主页与站内发帖 —— 既可以把博客当作一个 X 账号来逛，也能在开放注册后当作一个小型内容平台来运营。"
  logo: "data:image/svg+xml;base64,"
  homepage: "https://github.com/IFIAnder/halo-theme-X#readme"
  repo: "https://github.com/IFIAnder/halo-theme-X"
  issues: "https://github.com/IFIAnder/halo-theme-X/issues"
  settingName: "theme-x-setting"
  configMapName: "theme-x-configmap"
  version: "1.12.1"
  requires: ">=2.26.0"
  license:
    - name: "MIT"
      url: "https://opensource.org/licenses/MIT"
  customTemplates:
    post:
      - name: "长推文"
        description: "以 X 长推文的排版渲染文章：正文 17px、左对齐、弱化标题层级"
        file: post_longform.html
    page:
      - name: "个人主页"
        description: "以 X 个人主页的卡片样式渲染独立页面，带封面图与账号信息区"
        file: page_profile.html
