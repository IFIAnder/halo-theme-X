<!--
  个人资料编辑弹层（只给作者本人看）
  ------------------------------------------------------------------
  走 Halo 用户中心接口（/apis/** 免 CSRF）：
  - GET  /apis/api.console.halo.run/v1alpha1/users/-          读当前用户
  - PUT  /apis/api.console.halo.run/v1alpha1/users/-          改「显示名 + 简介」
  - POST /apis/api.console.halo.run/v1alpha1/users/-/avatar   换头像（multipart，字段名固定 file）

  两点容易踩：
  1. 都在 console 组下，不是 uc.api 组 —— uc.api 那个 users/- 只有 GET，
     拿 PUT 去请求会撞上静态资源兜底，报「No static resource ...」。
  2. PUT 吃的是完整的 User 对象，服务端还会校验 metadata.name 必须等于当前登录用户，
     所以流程是「先 GET → 改 spec → 整体写回」，只提交 { displayName, bio } 不行。
  注意：PUT 的可改字段只有 displayName / bio，用户名改不了，头像必须走上传接口。

  参数：displayName / bio / avatar / initial / handle
-->
<div
  class="x-modal"
  th:fragment="modal(displayName, bio, avatar, initial, handle)"
  data-x-modal="profile"
  hidden
>
  <div class="x-modal__mask" data-x-modal-close></div>

  <div class="x-modal__panel x-modal__panel--profile" role="dialog" aria-modal="true" aria-label="编辑个人资料">
    <header class="x-modal__head">
      <button class="x-iconbtn" type="button" data-x-modal-close aria-label="关闭">
        <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-close"></use></svg>
      </button>
      <span class="x-modal__title">编辑个人资料</span>
      <button class="x-btn x-btn--primary x-btn--sm" type="button" data-x-profile-save>保存</button>
    </header>

    <div class="x-modal__body">
      <div class="x-edit__cover">
        <div class="x-edit__cover-fallback"></div>
        <label class="x-edit__avatar" title="更换头像">
          <span class="x-edit__avatar-box" data-x-avatar-box>
            <img
              class="x-avatar x-avatar--96"
              th:if="${not #strings.isEmpty(avatar)}"
              th:src="@{${avatar}}"
              th:alt="${displayName}"
            />
            <span
              class="x-avatar x-avatar--96 x-avatar--fallback"
              th:unless="${not #strings.isEmpty(avatar)}"
              th:text="${initial}"
            ></span>
          </span>
          <span class="x-edit__avatar-mask">
            <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-image"></use></svg>
          </span>
          <input class="x-edit__file" type="file" accept="image/*" data-x-avatar-input aria-label="选择头像图片" />
        </label>
      </div>

      <label class="x-field">
        <span class="x-field__label">名称</span>
        <input class="x-field__input" type="text" maxlength="40" th:value="${displayName}" data-x-profile-name />
      </label>

      <label class="x-field">
        <span class="x-field__label">用户名</span>
        <input class="x-field__input" type="text" th:value="${'@' + handle}" disabled />
        <span class="x-field__note" th:text="${'用户名不可修改，它会出现在你的作者主页地址里。'}"></span>
      </label>

      <label class="x-field">
        <span class="x-field__label">简介</span>
        <textarea
          class="x-field__input x-field__input--area"
          rows="3"
          maxlength="160"
          data-x-profile-bio
          th:text="${bio}"
        ></textarea>
      </label>

      <!--
        以下三项由 halo-plugin-X 插件提供。主题不依赖它：
        探测不到（插件没装 / 没启用）时整块保持隐藏，其它功能照常。
      -->
      <div class="x-pluginx" data-x-plugin-x hidden>
        <div class="x-pluginx__head">
          <svg class="x-icon" viewBox="0 0 24 24"><use href="#i-sparkle"></use></svg>
          <span>扩展资料</span>
          <span class="x-pluginx__from">halo-plugin-X</span>
        </div>

        <label class="x-field">
          <span class="x-field__label">个人主页背景图</span>
          <input
            class="x-field__input"
            type="text"
            maxlength="512"
            placeholder="https://… 或 /upload/xxx.jpg"
            data-x-profile-cover
          />
          <span class="x-field__note">留空表示不使用背景图，会回退到主题的渐变底</span>
        </label>

        <label class="x-field">
          <span class="x-field__label">位置</span>
          <input class="x-field__input" type="text" maxlength="64" placeholder="例如 上海" data-x-profile-location />
        </label>

        <label class="x-field">
          <span class="x-field__label">个人网站</span>
          <input class="x-field__input" type="text" maxlength="512" placeholder="https://example.com" data-x-profile-website />
          <span class="x-field__note">会显示在你作者主页的资料行里</span>
        </label>
      </div>

      <p class="x-hint" data-x-profile-hint hidden></p>
    </div>
  </div>
</div>
